services:
  mysql:
    image: mysql:8.0
    container_name: spider-go-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spider-go-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  spider-go:
    # 默认只使用已加载的镜像，不再本地构建。
    # 原因：服务器上没有 Go 工具链 / 拉不到 goproxy，`build: .` 会让
    # `docker compose up -d` 尝试构建并失败或长时间卡住。
    # 现在的部署流程：docker load -i spider-go-image.tar && docker compose up -d
    #
    # 本地开发需要重新构建镜像时，显式加参数即可覆盖：
    #   docker compose up -d --build
    image: spider-go:latest
    container_name: spider-go
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GO_ENV=production
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      # 把你改好的 config 目录挂进容器，改配置只需重启容器，不用重新 build 镜像
      - ./config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: spider-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spider-go

volumes:
  mysql_data:
  redis_data: