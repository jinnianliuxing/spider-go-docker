# 生产环境配置（自部署版）
app:
  port: 8080
  env: production

cors:
  allow_origins:
    - "http://localhost"          # 本地部署默认
    - "http://localhost:8080"
    - "http://127.0.0.1"
    - "http://127.0.0.1:8080"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "Accept"
  expose_headers:
    - "Content-Length"
  allow_credentials: true
  max_age: 43200

# 数据库配置：host 用 docker-compose 里的服务名 "mysql"，密码要和 .env 里的 MYSQL_ROOT_PASSWORD 保持一致
database:
  driver: mysql
  source: mysql
  port: 3306
  user: root
  pass: root123                # 默认密码对应 .env.example 中的 MYSQL_ROOT_PASSWORD
  name: spider_go

# Redis 配置：host 用服务名 "redis"，密码要和 .env 里的 REDIS_PASSWORD 保持一致
redis:
  session:
    host: redis:6379
    pass: redis123              # 默认密码对应 .env.example 中的 REDIS_PASSWORD
    db: 0
  captcha:
    host: redis:6379
    pass: redis123              # 默认密码对应 .env.example 中的 REDIS_PASSWORD
    db: 1

jwt:
  secret: "dev_secret_key_change_in_production"
  issuer: "spider-go"


# 教务系统地址：这是学校官方系统，不是别人的私有服务器，一般不用改
jwc:
  mode: "webvpn"   # 在校园网内部署用 campus；外网访问学校系统用 webvpn
  # WebVPN Token URL（仅 webvpn 模式使用，CAS登录成功后用ticket交换webvpn-token）
  webvpn_token_url: "https://webvpn.csuft.edu.cn/api/access/auth/finish"

  campus:
    login_url: "https://cas.csuft.edu.cn/cas/login?service=https%3A%2F%2Fportal.csuft.edu.cn%2F%3Fpath%3Dhttps%253A%252F%252Fportal.csuft.edu.cn%252Fmain.html%2523%252F"
    redirect_url: "http://jwxt.csuft.edu.cn/jsxsd/sso.jsp"
    course_url: "http://jwxt.csuft.edu.cn/jsxsd/xskb/xskb_list.do?viweType=0"
    grade_url: "http://jwxt.csuft.edu.cn/jsxsd/kscj/cjcx_list"
    grade_level_url: "http://jwxt.csuft.edu.cn/jsxsd/kscj/djkscj_list?type=listData"
    exam_url: "http://jwxt.csuft.edu.cn/jsxsd/xsks/xsksap_list"
    evaluation_redirect_url: "https://cas.csuft.edu.cn/cas/login?service=https%3A%2F%2Fjxzlpt.csuft.edu.cn%3A443%2Fcas%2FtoUrl%3Ftype%3Dpc"
    evaluation_info_url: "https://jxzlpt.csuft.edu.cn/api/xspj/xspj/getXspjtask"
    evaluation_do_login_url: "https://jxzlpt.csuft.edu.cn/api/manage/cas/doLogin"
    evaluation_api_base_url: "https://jxzlpt.csuft.edu.cn/api/xspj/xspj"

  webvpn:
    login_url: "https://https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/login?service=https://webvpn.csuft.edu.cn/callback/cas/eAF0IG5N"
    webvpn_token_url: "https://webvpn.csuft.edu.cn/api/access/auth/finish"
    redirect_url: "https://http-jwxt-csuft-edu-cn-80.webvpn.csuft.edu.cn/jsxsd/sso.jsp"
    course_url: "https://http-jwxt-csuft-edu-cn-80.webvpn.csuft.edu.cn/jsxsd/xskb/xskb_list.do?viweType=0"
    grade_url: "https://http-jwxt-csuft-edu-cn-80.webvpn.csuft.edu.cn/jsxsd/kscj/cjcx_list"
    grade_level_url: "https://http-jwxt-csuft-edu-cn-80.webvpn.csuft.edu.cn/jsxsd/kscj/djkscj_list?type=listData"
    exam_url: "https://http-jwxt-csuft-edu-cn-80.webvpn.csuft.edu.cn/jsxsd/xsks/xsksap_list"
    # 教评系统走 webvpn 网关: 入口是 https-jxzlpt-csuft-edu-cn-443 域下的 /cas/toUrl?type=pc,
    # 由 webvpn 自动把 CAS 登录跳转到 https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn。
    evaluation_redirect_url: "https://https-jxzlpt-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/toUrl?type=pc"
    evaluation_info_url: "https://https-jxzlpt-csuft-edu-cn-443.webvpn.csuft.edu.cn/api/xspj/xspj/getXspjtask"
    evaluation_do_login_url: "https://https-jxzlpt-csuft-edu-cn-443.webvpn.csuft.edu.cn/api/manage/cas/doLogin"
    evaluation_api_base_url: "https://https-jxzlpt-csuft-edu-cn-443.webvpn.csuft.edu.cn/api/xspj/xspj"

  rsa_url: "https://https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/jwt/publicKey"
  mfa_detect_url: "https://https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/mfa/detect"
  captcha_url: "https://https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/needCaptcha.html?"
  captcha_image_url: "https://https-cas-csuft-edu-cn-443.webvpn.csuft.edu.cn/cas/captcha.html?"

# 邮件配置：用来发验证码，本地测试可以先不配，验证码会打印到日志
email:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  username: ""                   # 留空则本地测试跳过邮件发送，验证码打印在日志
  password: ""
  from_name: "Spider-Go 验证码"

# 微信登录：不需要的话留空即可，相关接口会失败但不影响其他功能
wx:
  app_id: ""
  app_secret: ""

# 对象存储：不需要文件上传功能的话可以留空/不管
oss:
  provider: "tencent"
  aliyun:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket_name: ""
    base_url: ""
    use_cdn: false
    cdn_domain: ""
  tencent:
    region: ""
    secret_id: ""
    secret_key: ""
    bucket_name: ""
    base_url: ""
    use_cdn: false
    cdn_domain: ""
  upload_path: "uploads/"
  max_file_size: 5242880
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
