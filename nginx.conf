events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log    error;

    sendfile        on;
    keepalive_timeout  65;

    # 使用 resolver 确保能解析 Docker 内部 DNS
    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # spider-go 主站
    # default_server 兜底：任何未匹配的域名（含直接用 IP 访问）都落到这里，
    # 避免落到别的站点造成串站。
    #
    # 注意：proxy_pass 用**变量式**写法，让 nginx 启动时不做上游 DNS 解析。
    # 否则若 spider-go 容器未运行，nginx 会因 "host not found in upstream"
    # 直接启动失败，连带把 csuft-sign 站点一起拖下水。
    # 变量式 + resolver 后，上游挂掉只会返回 502，nginx 本身照常运行。
    # =========================================================================
    server {
        listen 80 default_server;
        server_name spider-go.cc.cd 47.122.114.75;

        # /admin 无后缀直达管理后台
        location = /admin {
            return 301 /admin.html;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            # 禁用 HTML 缓存，确保每次加载最新版
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires 0;
            }
        }

        location /api/ {
            set $upstream_api http://spider-go:8080;
            proxy_pass $upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 电子成绩单导出：教务端生成 PDF + 发信较慢，放宽网关超时避免 504。
        # （后端已改为异步提交，此处为双保险）
        location /api/user/grades/transcript/ {
            set $upstream_transcript http://spider-go:8080;
            proxy_pass $upstream_transcript$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }

    # =========================================================================
    # csuft-sign（独立项目：/root/csuft-sign，容器 csuft-sign:8787）
    #
    # 该 vhost 原先放在容器的 /etc/nginx/conf.d/sign.conf，但 spider-nginx 并未
    # 挂载 conf.d，因此**容器一重建配置就丢**（2026-09-12 更新时发生过）。
    # 现并入本文件（bind-mount 到 /etc/nginx/nginx.conf），重建不再丢失。
    #
    # 环境: Cloudflare 代理(SSL/TLS 灵活模式) + 源站仅 80
    # 链路: 浏览器 --HTTPS--> Cloudflare --HTTP:80--> spider-nginx --> csuft-sign:8787
    #
    # 两个关键设计:
    #  1) resolver 127.0.0.11 + 变量式 proxy_pass: Docker 内嵌 DNS 动态解析容器 IP。
    #     这样 csuft-sign 重启后 IP 变了也能自动跟上, 且 nginx reload 时不要求容器已存在。
    #  2) 不设 auth_basic、不覆盖 Authorization 头: 浏览器弹框的 Basic 口令原样透传给后端校验。
    # =========================================================================
    server {
        listen 80;
        server_name sign.spider-go.cc.cd;

        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内嵌 DNS

        client_max_body_size 1m;

        location / {
            set $upstream_sign csuft-sign:8787;   # 容器名:端口
            proxy_pass http://$upstream_sign;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # 不要写 proxy_set_header Authorization ""; 否则后端收不到口令会一直 401
        }

        access_log /var/log/nginx/sign.access.log;
        error_log  /var/log/nginx/sign.error.log;
    }

    # ---------------------------------------------------------------------------
    # 【可选加固】Cloudflare → 源站这段目前是明文 HTTP(灵活模式)。
    # 去 CF: SSL/TLS → 源服务器 → 创建证书 → 保存 .pem/.key → 挂进容器 →
    # 用下面两块替换上面的 sign server 块, 再把 CF 模式从「灵活」改成「完全(严格)」。
    # ---------------------------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name sign.spider-go.cc.cd;
    #     return 301 https://$host$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name sign.spider-go.cc.cd;
    #
    #     ssl_certificate     /etc/nginx/certs/cloudflare/origin.pem;
    #     ssl_certificate_key /etc/nginx/certs/cloudflare/origin.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     client_max_body_size 1m;
    #
    #     location / {
    #         set $upstream_sign csuft-sign:8787;
    #         proxy_pass http://$upstream_sign;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
